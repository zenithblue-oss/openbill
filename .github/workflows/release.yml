name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore (if secrets present)
        env:
          KEYSTORE_B64: ${{ secrets.OPENBILL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/openbill-release.jks"
            echo "OPENBILL_STORE_FILE=$RUNNER_TEMP/openbill-release.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret; building unsigned release APK"
          fi
      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.OPENBILL_KEYSTORE_BASE64 }}
          OPENBILL_STORE_PASSWORD: ${{ secrets.OPENBILL_STORE_PASSWORD }}
          OPENBILL_KEY_ALIAS: ${{ secrets.OPENBILL_KEY_ALIAS }}
        run: |
          for v in KEYSTORE_B64 OPENBILL_STORE_PASSWORD OPENBILL_KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::Signing secret for $v is empty; refusing to build an unsigned release"
              exit 1
            fi
          done
      - name: Assemble release
        env:
          OPENBILL_STORE_PASSWORD: ${{ secrets.OPENBILL_STORE_PASSWORD }}
          OPENBILL_KEY_ALIAS: ${{ secrets.OPENBILL_KEY_ALIAS }}
          OPENBILL_KEY_PASSWORD: ${{ secrets.OPENBILL_KEY_PASSWORD }}
        run: ./gradlew --console=plain :androidApp:assembleRelease :androidApp:bundleRelease
      - name: Rename APK
        run: |
          mkdir -p out
          for f in androidApp/build/outputs/bundle/release/*.aab; do
            cp "$f" "out/OpenBill-${GITHUB_REF_NAME}-android.aab"
          done
          for f in androidApp/build/outputs/apk/release/*.apk; do
            case "$f" in
              *unsigned*) cp "$f" "out/OpenBill-${GITHUB_REF_NAME}-android-unsigned.apk" ;;
              *) cp "$f" "out/OpenBill-${GITHUB_REF_NAME}-android.apk" ;;
            esac
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            task: :desktopApp:packageMsi :desktopApp:packageExe
          - os: windows-11-arm
            arch: arm64
            task: :desktopApp:packageMsi :desktopApp:packageExe
          - os: ubuntu-latest
            arch: x64
            task: :desktopApp:packageDeb
          - os: ubuntu-24.04-arm
            arch: arm64
            task: :desktopApp:packageDeb
    runs-on: ${{ matrix.os }}
    # ARM64 Windows support in the Compose/Skia toolchain is newer; don't block the release on it
    continue-on-error: ${{ matrix.os == 'windows-11-arm' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Package
        shell: bash
        run: ./gradlew --console=plain ${{ matrix.task }} :desktopApp:createDistributable
      - name: Collect Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "desktopApp/build/release"
          New-Item -ItemType Directory -Force $out | Out-Null
          $base = "OpenBill-$env:GITHUB_REF_NAME-windows-${{ matrix.arch }}"
          Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Copy-Item -Destination "$out/$base.msi"
          Get-ChildItem desktopApp/build/compose/binaries/main/exe/*.exe | Copy-Item -Destination "$out/$base-setup.exe"
          Compress-Archive -Path desktopApp/build/compose/binaries/main/app/OpenBill -DestinationPath "$out/$base-portable.zip"
      - name: Collect Linux packages
        if: runner.os == 'Linux'
        run: |
          out=desktopApp/build/release
          mkdir -p "$out"
          cp desktopApp/build/compose/binaries/main/deb/*.deb "$out/"
          tar -C desktopApp/build/compose/binaries/main/app -czf \
            "$out/OpenBill-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz" OpenBill
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ matrix.arch }}
          path: desktopApp/build/release/*
          if-no-files-found: error

  # The `openbill` command-line client: one portable JVM build (Java 17+ on the machine; the
  # bundled SQLite jar carries natives for Linux, Windows and macOS). Not code-signed yet.
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --console=plain -Popenbill.version="${GITHUB_REF_NAME#v}" :cli:test :cli:installDist
      - name: Package tar.gz, zip and deb
        run: |
          set -euo pipefail
          out=cli/build/release
          base="openbill-cli-${GITHUB_REF_NAME}"
          mkdir -p "$out" stage
          cp -r cli/build/install/openbill "stage/$base"
          tar -C stage -czf "$out/$base-linux.tar.gz" "$base"
          (cd stage && zip -qr "../$out/$base-windows.zip" "$base")
          ver="${GITHUB_REF_NAME#v}"
          pkg=stage/deb
          mkdir -p "$pkg/DEBIAN" "$pkg/usr/lib/openbill-cli" "$pkg/usr/bin"
          cp -r cli/build/install/openbill/. "$pkg/usr/lib/openbill-cli/"
          ln -s ../lib/openbill-cli/bin/openbill "$pkg/usr/bin/openbill"
          rm -f "$pkg/usr/lib/openbill-cli/bin/openbill.bat"
          printf '%s\n' "Package: openbill-cli" "Version: $ver" "Section: utils" "Priority: optional" "Architecture: all" \
            "Depends: default-jre-headless (>= 2:1.17) | java17-runtime-headless" \
            "Maintainer: OpenBill <noreply@github.com>" \
            "Description: OpenBill command-line client" " Reads and writes OpenBill data and backups from scripts." > "$pkg/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$pkg" "$out/openbill-cli_${ver}_all.deb"
          "$pkg/usr/bin/openbill" version | grep -F "openbill $ver "
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: cli/build/release/*
          if-no-files-found: error

  publish:
    needs: [android, desktop, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          mkdir flat
          find dist -type f -exec mv -n {} flat/ \;
          # The signed APK is attached manually unless CI signing secrets exist
          rm -f flat/*-unsigned.apk
          cd flat
          ls -l
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release if missing, then upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "OpenBill $GITHUB_REF_NAME" \
              --generate-notes --verify-tag || true
          fi
          gh release upload "$GITHUB_REF_NAME" flat/* --clobber
