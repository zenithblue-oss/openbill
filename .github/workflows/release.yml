name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore (if secrets present)
        env:
          KEYSTORE_B64: ${{ secrets.OPENBILL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/openbill-release.jks"
            echo "OPENBILL_STORE_FILE=$RUNNER_TEMP/openbill-release.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret; building unsigned release APK"
          fi
      - name: Assemble release
        env:
          OPENBILL_STORE_PASSWORD: ${{ secrets.OPENBILL_STORE_PASSWORD }}
          OPENBILL_KEY_ALIAS: ${{ secrets.OPENBILL_KEY_ALIAS }}
          OPENBILL_KEY_PASSWORD: ${{ secrets.OPENBILL_KEY_PASSWORD }}
        run: ./gradlew --console=plain :androidApp:assembleRelease
      - name: Rename APK
        run: |
          mkdir -p out
          for f in androidApp/build/outputs/apk/release/*.apk; do
            case "$f" in
              *unsigned*) cp "$f" "out/OpenBill-${GITHUB_REF_NAME}-android-unsigned.apk" ;;
              *) cp "$f" "out/OpenBill-${GITHUB_REF_NAME}-android.apk" ;;
            esac
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: :desktopApp:packageMsi :desktopApp:packageExe
            glob: |
              desktopApp/build/compose/binaries/main/msi/*.msi
              desktopApp/build/compose/binaries/main/exe/*.exe
              desktopApp/build/portable/*.zip
          - os: ubuntu-latest
            task: :desktopApp:packageDeb :desktopApp:packageAppImage
            glob: |
              desktopApp/build/compose/binaries/main/deb/*.deb
              desktopApp/build/compose/binaries/main/appimage/*.AppImage
              desktopApp/build/portable/*.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Package
        shell: bash
        run: ./gradlew --console=plain ${{ matrix.task }}
      - name: Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./gradlew --console=plain :desktopApp:createDistributable
          New-Item -ItemType Directory -Force desktopApp/build/portable | Out-Null
          Compress-Archive -Path desktopApp/build/compose/binaries/main/app/OpenBill -DestinationPath "desktopApp/build/portable/OpenBill-$env:GITHUB_REF_NAME-windows-x64.zip"
      - name: Linux portable tarball
        if: runner.os == 'Linux'
        run: |
          ./gradlew --console=plain :desktopApp:createDistributable
          mkdir -p desktopApp/build/portable
          tar -C desktopApp/build/compose/binaries/main/app -czf \
            "desktopApp/build/portable/OpenBill-${GITHUB_REF_NAME}-linux-x64.tar.gz" OpenBill
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          mkdir flat
          find dist -type f -exec mv -n {} flat/ \;
          # The signed APK is attached manually unless CI signing secrets exist
          rm -f flat/*-unsigned.apk
          cd flat
          ls -l
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release if missing, then upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "OpenBill $GITHUB_REF_NAME" \
              --generate-notes --verify-tag || true
          fi
          gh release upload "$GITHUB_REF_NAME" flat/* --clobber
